name: Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install required Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Native integration tests
        run: >-
          xcodebuild test -project ManPageCatalog.xcodeproj -scheme ManPageCatalog
          -destination 'platform=macOS' CODE_SIGN_IDENTITY="-"
