name: Native CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install required Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Native integration tests
        run: >-
          xcodebuild test -project ManPageCatalog.xcodeproj -scheme ManPageCatalog
          -destination 'platform=macOS' -resultBundlePath "${{ runner.temp }}/native-tests.xcresult" CODE_SIGN_IDENTITY="-"
      - name: Retain isolated native test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-test-results
          path: ${{ runner.temp }}/native-tests.xcresult
          if-no-files-found: error
          retention-days: 1
