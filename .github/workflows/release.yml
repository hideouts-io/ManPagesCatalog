name: Build release artifact

permissions:
  contents: read

on:
  workflow_dispatch:  # manual only — releases are created locally via gh release create

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install required Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Native integration tests
        run: |
          xcodebuild test -project ManPageCatalog.xcodeproj -scheme ManPageCatalog \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY="-"

      - name: Build Release Archive
        run: |
          xcodebuild archive \
            -project ManPageCatalog.xcodeproj \
            -scheme ManPageCatalog \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ManPageCatalog.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64"

      - name: Package .app into zip (app only, no source)
        run: |
          ditto -ck --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ManPageCatalog.xcarchive/Products/Applications/Man Page Catalog.app" \
            ManPageCatalog-macOS.zip

      - name: Verify zip contains only the app
        run: unzip -l ManPageCatalog-macOS.zip | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ManPageCatalog-macOS
          path: ManPageCatalog-macOS.zip
