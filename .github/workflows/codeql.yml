name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install required Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: swift
          build-mode: manual
      - name: Build native application
        run: >-
          xcodebuild build -project ManPageCatalog.xcodeproj -scheme ManPageCatalog
          -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/codeql-build"
          CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          upload: false
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:swift
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-swift
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  supported:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          upload: false
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  upload-swift:
    name: Upload Swift analysis
    needs: swift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codeql-swift
          path: sarif
      - name: Upload analysis to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: sarif
          category: /language:swift
          wait-for-processing: true

  upload-supported:
    name: Upload ${{ matrix.language }} analysis
    needs: supported
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
      - name: Upload analysis to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: sarif
          category: /language:${{ matrix.language }}
          wait-for-processing: true
