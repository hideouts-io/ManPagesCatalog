name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and resolve required Metal toolchain
        id: metal
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showComponent MetalToolchain -json > "$RUNNER_TEMP/metal-toolchain.json"
          identifier=$(jq -er 'select(.status == "installed") | .toolchainIdentifier | select(type == "string" and test("^com\\.apple\\.dt\\.toolchain\\.Metal\\.[A-Za-z0-9.]+$"))' "$RUNNER_TEMP/metal-toolchain.json")
          search_path=$(jq -er 'select(.status == "installed") | .toolchainSearchPath | select(type == "string" and test("^/private/var/run/com\\.apple\\.security\\.cryptexd/mnt/[-A-Za-z0-9._]+$"))' "$RUNNER_TEMP/metal-toolchain.json")
          test -x "$search_path/Metal.xctoolchain/usr/bin/metal"
          test -x "$search_path/Metal.xctoolchain/usr/bin/metallib"
          test "$(EXTERNAL_TOOLCHAINS_DIR="$search_path" xcrun --toolchain "$identifier" --sdk macosx --find metal)" -ef "$search_path/Metal.xctoolchain/usr/bin/metal"
          test "$(EXTERNAL_TOOLCHAINS_DIR="$search_path" xcrun --toolchain "$identifier" --sdk macosx --find metallib)" -ef "$search_path/Metal.xctoolchain/usr/bin/metallib"
          "$search_path/Metal.xctoolchain/usr/bin/metal" -v
          printf 'identifier=%s\nsearch-path=%s\n' "$identifier" "$search_path" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: swift-init
        with:
          languages: swift
          build-mode: manual
          db-location: ${{ runner.temp }}/application-codeql-db
      - name: Build native application
        # Resolve Metal before CodeQL tracing changes toolchain discovery (codeql-action#3978).
        env:
          EXTERNAL_TOOLCHAINS_DIR: ${{ steps.metal.outputs.search-path }}
          METAL_TOOLCHAIN_IDENTIFIER: ${{ steps.metal.outputs.identifier }}
        run: |
          xcodebuild build -project ManPageCatalog.xcodeproj -scheme ManPageCatalog \
            -configuration Debug -destination 'platform=macOS,arch=x86_64' -derivedDataPath "$RUNNER_TEMP/codeql-build" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO SWIFT_COMPILATION_MODE=wholemodule \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO TOOLCHAINS="$METAL_TOOLCHAIN_IDENTIFIER com.apple.dt.toolchain.XcodeDefault"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:swift
      - name: Reject Swift extraction errors
        env:
          SARIF_FILE: ${{ runner.temp }}/codeql-sarif/swift.sarif
        run: |
          if [[ ! -s "$SARIF_FILE" ]]; then
            printf 'Swift SARIF is missing or empty.\n' >&2
            exit 1
          fi
          error_count="$(jq -er '
            if type != "object" or (.runs | type) != "array" or (.runs | length) == 0 then
              error("Invalid Swift SARIF runs")
            elif any(.runs[]; type != "object" or (.invocations | type) != "array" or (.invocations | length) == 0) then
              error("Invalid Swift SARIF invocations")
            elif any(.runs[].invocations[]; type != "object" or (.toolExecutionNotifications | type) != "array") then
              error("Invalid Swift SARIF notifications")
            elif any(.runs[].invocations[].toolExecutionNotifications[]; type != "object" or (.descriptor | type) != "object" or (.descriptor.id | type) != "string") then
              error("Invalid Swift SARIF notification descriptor")
            else
              [.runs[].invocations[].toolExecutionNotifications[] | select(.descriptor.id == "swift/diagnostics/extraction-errors")] | length
            end
          ' "$SARIF_FILE")"
          if [[ "$error_count" != "0" ]]; then
            printf 'Swift extraction reported %s compiler diagnostics; inspect the analysis diagnostics before publishing SARIF.\n' "$error_count" >&2
            exit 1
          fi
          printf 'Swift extraction compiler diagnostics: 0\n'
      - name: Inspect application PDFKit semantics
        if: success() || failure()
        env:
          CODEQL_CLI: ${{ steps.swift-init.outputs.codeql-path }}
        run: |
          bash .github/codeql/pdfkit/inspect-database.sh "$CODEQL_CLI" \
            "$RUNNER_TEMP/application-codeql-db/swift" "$RUNNER_TEMP/application-semantics"
      - name: Upload semantic probe results
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: application-pdfkit-semantics
          path: |
            ${{ runner.temp }}/application-semantics/*.csv
            ${{ runner.temp }}/application-semantics/codeql-pack.lock.yml
          if-no-files-found: error
          retention-days: 1
      - name: Upload SARIF artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-swift
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  pdfkit-reproduction:
    name: PDFKit ${{ matrix.source }} Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.4.1", "26.3"]
        source: [baseline, explicit-class, selective-pdfkit]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/setup-codeql@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: probe-init
        with:
          languages: swift
          tools: linked
      - name: Compare public PDFKit reproduction and imported semantics
        env:
          CODEQL_CLI: ${{ steps.probe-init.outputs.codeql-path }}
          PROBE_SOURCE: ${{ matrix.source }}
        run: |
          test -d "$DEVELOPER_DIR"
          bash .github/codeql/pdfkit/reproduce.sh "$CODEQL_CLI" \
            ".github/codeql/pdfkit/$PROBE_SOURCE/FileUtilities.swift" "$RUNNER_TEMP/pdfkit-reproduction"
      - name: Upload fixture-only diagnostic results
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdfkit-${{ matrix.source }}-xcode-${{ matrix.xcode }}
          path: |
            ${{ runner.temp }}/pdfkit-reproduction/summary/*
            ${{ runner.temp }}/pdfkit-reproduction/toolchain.txt
            ${{ runner.temp }}/pdfkit-reproduction/codeql-version.json
          if-no-files-found: error
          retention-days: 1

  import-isolation:
    name: Import-only ${{ matrix.module }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [foundation, appkit, pdfkit]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/setup-codeql@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: isolation-setup
        with:
          languages: swift
          tools: linked
      - name: Extract one SDK import without PDF operations
        env:
          CODEQL_CLI: ${{ steps.isolation-setup.outputs.codeql-path }}
          PROBE_MODULE: ${{ matrix.module }}
        run: |
          bash .github/codeql/pdfkit/isolate-import.sh "$CODEQL_CLI" \
            ".github/codeql/pdfkit/import-controls/$PROBE_MODULE/Probe.swift" "$RUNNER_TEMP/import-isolation"
      - name: Upload import-only diagnostic summary
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: import-only-${{ matrix.module }}
          path: ${{ runner.temp }}/import-isolation/summary/*
          if-no-files-found: error
          retention-days: 1

  matching-compiler:
    name: Swift 6.3.1 extraction with current analysis
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify official matching-compiler bundle
        run: |
          curl --fail --location --connect-timeout 10 --max-time 300 \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.25.5/codeql-bundle-osx64.tar.gz \
            -o "$RUNNER_TEMP/codeql-2.25.5.tar.gz"
          printf 'c365f6c41145b97150c32026f72df1d02060b15c560588785e764eec10be945e  %s\n' "$RUNNER_TEMP/codeql-2.25.5.tar.gz" | shasum -a 256 -c -
      - uses: github/codeql-action/setup-codeql@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: matching-extractor
        with:
          languages: swift
          tools: ${{ runner.temp }}/codeql-2.25.5.tar.gz
      - uses: github/codeql-action/setup-codeql@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: current-analysis
        with:
          languages: swift
          tools: linked
      - name: Compare matching extraction with unchanged current security queries
        env:
          EXTRACTOR_CLI: ${{ steps.matching-extractor.outputs.codeql-path }}
          ANALYSIS_CLI: ${{ steps.current-analysis.outputs.codeql-path }}
        run: |
          bash .github/codeql/pdfkit/compare-extractor.sh "$EXTRACTOR_CLI" "$ANALYSIS_CLI" "$RUNNER_TEMP/matching-extractor"
      - name: Upload matching-compiler diagnostic summary
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: matching-compiler-current-analysis
          path: ${{ runner.temp }}/matching-extractor/summary/*
          if-no-files-found: error
          retention-days: 1

  supported:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  upload-swift:
    name: Upload Swift analysis
    needs: swift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codeql-swift
          path: sarif
      - name: Upload analysis to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif
          category: /language:swift
          wait-for-processing: true

  upload-supported:
    name: Upload ${{ matrix.language }} analysis
    needs: supported
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
      - name: Upload analysis to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  upload-gate:
    name: Code scanning uploads
    needs: [upload-swift, upload-supported]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every analysis upload to succeed
        env:
          SWIFT_UPLOAD_RESULT: ${{ needs.upload-swift.result }}
          SUPPORTED_UPLOAD_RESULT: ${{ needs.upload-supported.result }}
        run: |
          if [[ "$SWIFT_UPLOAD_RESULT" != "success" ]] || [[ "$SUPPORTED_UPLOAD_RESULT" != "success" ]]; then
            printf 'Code scanning upload failed or was skipped: swift=%s; supported=%s\n' "$SWIFT_UPLOAD_RESULT" "$SUPPORTED_UPLOAD_RESULT" >&2
            exit 1
          fi
