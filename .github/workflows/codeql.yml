name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Analyze Swift
    runs-on: macos-26-intel
    # Includes pinned builds, sequential SDK controls, and native app analysis.
    timeout-minutes: 130
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      CODEQL_EXTRACTOR_SWIFT_LOG_LEVELS: "*:info,out:binary:no_logs,out:text:info,out:console:warning"
      CODEQL_ACTION_EXTRA_OPTIONS: >-
        {"database":{"init":["--search-path=${{ github.workspace }}/build/compiler-candidate/pack-C"]},"resolve":{"extractor":["--search-path=${{ github.workspace }}/build/compiler-candidate/pack-C"],"languages":["--search-path=${{ github.workspace }}/build/compiler-candidate/pack-C"]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and resolve required Metal toolchain
        id: metal
        timeout-minutes: 10
        run: bash .github/codeql/prepare-metal-toolchain.sh "$RUNNER_TEMP" "$GITHUB_OUTPUT"
      - name: Prepare the verified official CodeQL bundle before tracing
        id: stock
        timeout-minutes: 10
        run: |
          python3 .github/codeql/pdfkit/compiler-candidate/setup-stock-codeql.py \
            --output "$RUNNER_TEMP/stock-codeql"
          archive=$(cat "$RUNNER_TEMP/stock-codeql/summary/archive-path.txt")
          cli=$(cat "$RUNNER_TEMP/stock-codeql/summary/cli-path.txt")
          test "$archive" = "$RUNNER_TEMP/stock-codeql/codeql-bundle-osx64.tar.zst"
          test "$cli" = "$RUNNER_TEMP/stock-codeql/bundle/codeql/codeql"
          printf 'archive=%s\ncli=%s\n' "$archive" "$cli" >> "$GITHUB_OUTPUT"
      - name: Build the controlled Swift importer correction
        timeout-minutes: 25
        run: |
          python3 .github/codeql/pdfkit/compiler-candidate/build-extractors.py \
            --output "$GITHUB_WORKSPACE/build/compiler-candidate"
      - name: Require compiler controls before application tracing
        timeout-minutes: 65
        env:
          CODEQL_CLI: ${{ steps.stock.outputs.cli }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/codeql/pdfkit/compiler-validation/validate-extractors.py \
            --codeql "$CODEQL_CLI" \
            --control-pack "$GITHUB_WORKSPACE/build/compiler-candidate/pack-B" \
            --patched-pack "$GITHUB_WORKSPACE/build/compiler-candidate/pack-C" \
            --output "$RUNNER_TEMP/compiler-validation" \
            --candidate-revision "$CANDIDATE_REVISION"
          jq -e '.differential_fixture_validation == true and .case_count == 24 and .stock_bundle_unchanged == true' \
            "$RUNNER_TEMP/compiler-validation/summary/verdict.json"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: init
        with:
          languages: swift
          build-mode: manual
          tools: ${{ steps.stock.outputs.archive }}
      - name: Verify initialized tool identity and extractor selection
        env:
          CODEQL_CLI: ${{ steps.init.outputs.codeql-path }}
          PREINIT_CLI: ${{ steps.stock.outputs.cli }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/initialized-codeql"
          "$CODEQL_CLI" version --format=json > "$RUNNER_TEMP/initialized-codeql/version.json"
          jq -e '.version == "2.27.3"' "$RUNNER_TEMP/initialized-codeql/version.json"
          for suffix in codeql swift/tools/osx64/extractor.real swift/swift.dbscheme; do
            actual=$(shasum -a 256 "$(dirname "$CODEQL_CLI")/$suffix")
            expected=$(shasum -a 256 "$(dirname "$PREINIT_CLI")/$suffix")
            test "${actual%% *}" = "${expected%% *}"
          done
          expected_pack="$GITHUB_WORKSPACE/build/compiler-candidate/pack-C"
          "$CODEQL_CLI" resolve extractor --language=swift --search-path="$expected_pack" \
            --format=json > "$RUNNER_TEMP/initialized-codeql/extractor.json"
          selected_pack=$(jq -er 'select(type == "string" and length > 0)' "$RUNNER_TEMP/initialized-codeql/extractor.json")
          test "$(cd "$selected_pack" && pwd -P)" = "$(cd "$expected_pack" && pwd -P)"
          shasum -a 256 "$CODEQL_CLI" "$(dirname "$CODEQL_CLI")/swift/tools/osx64/extractor.real" \
            "$(dirname "$CODEQL_CLI")/swift/swift.dbscheme" > "$RUNNER_TEMP/initialized-codeql/stock-before.sha256"
      - name: Build native application
        # Resolve Metal before CodeQL tracing changes toolchain discovery (codeql-action#3978).
        env:
          EXTERNAL_TOOLCHAINS_DIR: ${{ steps.metal.outputs.search-path }}
          METAL_TOOLCHAIN_IDENTIFIER: ${{ steps.metal.outputs.identifier }}
        run: |
          set -euo pipefail
          xcodebuild build -project ManPageCatalog.xcodeproj -scheme ManPageCatalog \
            -configuration Debug -destination 'platform=macOS,arch=x86_64' -derivedDataPath "$RUNNER_TEMP/codeql-build" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO SWIFT_COMPILATION_MODE=wholemodule \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO TOOLCHAINS="$METAL_TOOLCHAIN_IDENTIFIER com.apple.dt.toolchain.XcodeDefault" \
            2>&1 | tee "$RUNNER_TEMP/initialized-codeql/application-build.log"
          grep -q 'CompileMetalFile ' "$RUNNER_TEMP/initialized-codeql/application-build.log"
          grep -q 'MetalLink ' "$RUNNER_TEMP/initialized-codeql/application-build.log"
          test -s "$RUNNER_TEMP/codeql-build/Build/Products/Debug/SwiftTerm_SwiftTerm.bundle/Contents/Resources/default.metallib"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:swift
      - name: Reject Swift extraction errors
        env:
          SARIF_FILE: ${{ runner.temp }}/codeql-sarif/swift.sarif
        run: |
          if [[ ! -s "$SARIF_FILE" ]]; then
            printf 'Swift SARIF is missing or empty.\n' >&2
            exit 1
          fi
          error_count="$(jq -er '
            if type != "object" or (.runs | type) != "array" or (.runs | length) == 0 then
              error("Invalid Swift SARIF runs")
            elif any(.runs[]; type != "object" or (.invocations | type) != "array" or (.invocations | length) == 0) then
              error("Invalid Swift SARIF invocations")
            elif any(.runs[].invocations[]; type != "object" or (.toolExecutionNotifications | type) != "array") then
              error("Invalid Swift SARIF notifications")
            elif any(.runs[].invocations[].toolExecutionNotifications[]; type != "object" or (.descriptor | type) != "object" or (.descriptor.id | type) != "string") then
              error("Invalid Swift SARIF notification descriptor")
            else
              [.runs[].invocations[].toolExecutionNotifications[] | select(.descriptor.id == "swift/diagnostics/extraction-errors")] | length
            end
          ' "$SARIF_FILE")"
          if [[ "$error_count" != "0" ]]; then
            printf 'Swift extraction reported %s compiler diagnostics; inspect the analysis diagnostics before publishing SARIF.\n' "$error_count" >&2
            exit 1
          fi
          printf 'Swift extraction compiler diagnostics: 0\n'
      - name: Require every application Swift source to be extracted
        env:
          SARIF_FILE: ${{ runner.temp }}/codeql-sarif/swift.sarif
        run: |
          git ls-files -- 'ManPageCatalog/*.swift' | LC_ALL=C sort > "$RUNNER_TEMP/initialized-codeql/expected-sources.txt"
          test -s "$RUNNER_TEMP/initialized-codeql/expected-sources.txt"
          jq -er '[.runs[].invocations[].toolExecutionNotifications[] |
            select(.descriptor.id == "swift/diagnostics/successfully-extracted-files") |
            .locations[].physicalLocation.artifactLocation.uri |
            select(startswith("ManPageCatalog/"))] | unique | .[]' \
            "$SARIF_FILE" | LC_ALL=C sort > "$RUNNER_TEMP/initialized-codeql/extracted-sources.txt"
          cmp "$RUNNER_TEMP/initialized-codeql/expected-sources.txt" "$RUNNER_TEMP/initialized-codeql/extracted-sources.txt"
      - name: Require stock tools to remain unchanged after application analysis
        env:
          CODEQL_CLI: ${{ steps.init.outputs.codeql-path }}
        run: |
          shasum -a 256 "$CODEQL_CLI" "$(dirname "$CODEQL_CLI")/swift/tools/osx64/extractor.real" \
            "$(dirname "$CODEQL_CLI")/swift/swift.dbscheme" > "$RUNNER_TEMP/initialized-codeql/stock-after.sha256"
          cmp "$RUNNER_TEMP/initialized-codeql/stock-before.sha256" "$RUNNER_TEMP/initialized-codeql/stock-after.sha256"
      - name: Upload public compiler validation evidence
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-swift-compiler-evidence
          path: |
            ${{ runner.temp }}/metal-evidence/**
            ${{ runner.temp }}/stock-codeql/summary/**
            ${{ runner.temp }}/stock-codeql/logs/**
            ${{ github.workspace }}/build/compiler-candidate/summary/**
            ${{ github.workspace }}/build/compiler-candidate/logs/**
            ${{ runner.temp }}/compiler-validation/summary/**
            ${{ runner.temp }}/compiler-validation/logs/**
            ${{ runner.temp }}/initialized-codeql/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload SARIF artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-swift
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  supported:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 1

  upload-swift:
    name: Upload Swift analysis
    needs: swift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codeql-swift
          path: sarif
      - name: Upload analysis to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif
          category: /language:swift
          wait-for-processing: true

  upload-supported:
    name: Upload ${{ matrix.language }} analysis
    needs: supported
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
      - name: Upload analysis to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  upload-gate:
    name: Code scanning uploads
    needs: [upload-swift, upload-supported]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every analysis upload to succeed
        env:
          SWIFT_UPLOAD_RESULT: ${{ needs.upload-swift.result }}
          SUPPORTED_UPLOAD_RESULT: ${{ needs.upload-supported.result }}
        run: |
          if [[ "$SWIFT_UPLOAD_RESULT" != "success" ]] || [[ "$SUPPORTED_UPLOAD_RESULT" != "success" ]]; then
            printf 'Code scanning upload failed or was skipped: swift=%s; supported=%s\n' "$SWIFT_UPLOAD_RESULT" "$SUPPORTED_UPLOAD_RESULT" >&2
            exit 1
          fi
