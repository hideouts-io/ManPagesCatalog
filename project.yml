name: ManPageCatalog
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0

targets:
  ManPageCatalog:
    productName: Man Page Catalog
    type: application
    platform: macOS
    sources:
      - path: ManPageCatalog
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ManPageCatalog
        PRODUCT_NAME: Man Page Catalog
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: ManPageCatalog/ManPageCatalog.entitlements
    dependencies:
      - package: SwiftTerm
      - sdk: PDFKit.framework
      - sdk: WebKit.framework
      - sdk: libsqlite3.tbd
    info:
      path: ManPageCatalog/Info.plist
      properties:
        CFBundleName: Man Page Catalog
        CFBundleDisplayName: Man Page Catalog
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "20001"
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "13.0"
        CFBundleURLTypes:
          - CFBundleURLName: Manual Reference
            CFBundleURLSchemes:
              - manpagescatalog
  ManPageCatalogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NativeTests
    dependencies:
      - target: ManPageCatalog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"

schemes:
  ManPageCatalog:
    build:
      targets:
        ManPageCatalog: all
        ManPageCatalogTests: [test]
    test:
      environmentVariables:
        MANPATH: /var/empty
      commandLineArguments:
        "-libraryDirectory /tmp/ManPagesCatalog-test-cache": true
      targets:
        - ManPageCatalogTests
